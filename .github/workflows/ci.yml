name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check
        run: |
          . .venv/bin/activate
          python -m py_compile main.py cli.py web_ui.py
          python -m py_compile core/*.py services/*.py modules/*.py utils/*.py tests/*.py

      - name: Unit tests
        run: |
          . .venv/bin/activate
          pytest tests/ -q
